version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: asset_tracker_user
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: asset_tracker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: